sonar.projectKey=sgi-fiis-frontend
sonar.projectName=SGI-FIIS Frontend
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.tsx,src/**/*.test.ts
sonar.exclusions=src/**/*.test.tsx,src/**/*.test.ts,src/test-i18n.ts,src/main.tsx,src/i18n/**,src/assets/**

sonar.sourceEncoding=UTF-8

# Vitest coverage (provider v8 -> lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# SonarQube server (local docker). Auth via SONAR_TOKEN env (password auth disabled in 9.9).
sonar.host.url=http://localhost:9000
